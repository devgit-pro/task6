name: Secure CI Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean old containers
        run: docker compose down || true

      - name: Build Docker image
        run: docker compose build --no-cache

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberdyne/data-processing-api:secure
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Start container
        run: docker compose up -d

      - name: Show containers
        run: docker ps -a

      - name: Show logs
        run: |
          sleep 10
          docker logs data-processing-api || true

      - name: Test health endpoint
        run: curl --fail http://127.0.0.1:5000/health

      - name: Test API endpoint
        run: |
          curl --fail -X POST http://127.0.0.1:5000/process \
          -H "Content-Type: application/json" \
          -d '{"shipment_id":"SHP001","destination":"Colombo","status":"pending"}'

      - name: Stop container
        if: always()
        run: docker compose down
