name: Secure CI Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Start container
        run: docker compose up -d

      - name: Show running containers
        run: docker ps -a

      - name: Wait for app
        run: |
          sleep 15
          docker logs data-processing-api || true

      - name: Test health endpoint
        run: curl --fail http://127.0.0.1:5000/health

      - name: Test API endpoint
        run: |
          curl --fail -X POST http://127.0.0.1:5000/process \
          -H "Content-Type: application/json" \
          -d '{"shipment_id":"SHP001","destination":"Colombo","status":"pending"}'

      - name: Stop container
        if: always()
        run: docker compose down
